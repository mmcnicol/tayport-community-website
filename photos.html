<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Photos - Tayport Community</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tayport Community Website" />
    <meta property="og:title" content="Photos - Tayport Community" />
    <meta property="og:description" content="Photo gallery for the Tayport Community Website." />
    <meta property="og:url" content="https://tayport.org.uk/photos.html" />
    <meta property="og:image" content="https://tayport.org.uk/media/thumbs/Tay_View_from_West_Lights_2006.JPG" />

    <style>
      *, *:after, *:before { box-sizing: border-box; }

      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 100%;
        margin: 0;
        padding: 0;
        background: #f0f0f0;
        color: #222;
      }

      a         { color: #0066cc; }
      a:visited { color: #551a8b; }

      /* ── Site header ── */
      .site-header { background: #fff; border-bottom: 1px solid #ccc; }
      .site-header-inner {
        max-width: 1060px;
        margin: 0 auto;
        padding: 0 16px;
        display: flex;
        align-items: center;
        min-height: 50px;
      }
      .site-title { font-size: 1.1em; font-weight: bold; }
      .site-title a           { color: #222; text-decoration: none; }
      .site-title a:hover     { text-decoration: underline; }
      .site-title a:visited   { color: #222; }
      .site-title .sep        { color: #999; margin: 0 6px; font-weight: normal; }

      /* ── Gallery area ── */
      .gallery-wrap {
        max-width: 1060px;
        margin: 0 auto;
        padding: 16px;
      }

      #container { width: 100%; }

      .item {
        width: 140px;
        height: 140px;
        margin: 5px;
        overflow: hidden;
        display: inline-block;
        vertical-align: top;
      }
      .item a { display: block; width: 100%; height: 100%; }
      .item img {
        width: 140px;
        height: 140px;
        object-fit: cover;
        display: block;
        border: none;
      }

      /* ── Footer ── */
      .site-footer {
        text-align: center;
        font-size: 0.82em;
        color: #666;
        padding: 16px;
        margin-top: 8px;
      }
      .site-footer a { color: #666; }
    </style>

  </head>
  <body>

    <header class="site-header">
      <div class="site-header-inner">
        <div class="site-title">
          <a href="/">Tayport Community Website</a>
          <span class="sep">&rsaquo;</span>
          <a href="/photos.html">Photos</a>
        </div>
      </div>
    </header>

    <div class="gallery-wrap">
      <div id="container"></div>

      <script type="text/x-handlebars-template" id="waterfall-tpl">
        {{#result}}
        <span class="item">
          <a href="media/{{image}}"><img src="media/thumbs/{{image}}" width="{{width}}" height="{{height}}" loading="lazy" /></a>
        </span>
        {{/result}}
      </script>
    </div>

    <div class="site-footer">
      <p><a href="https://tayport.org.uk">Tayport Community Website</a> &nbsp;·&nbsp; Supported by Tayport Community Council [April 2003 – present]</p>
    </div>

    <script src="assets/jquery.min.js"></script>
    <script src="assets/handlebars.js"></script>
    <script src="assets/waterfall.min.js"></script>
    <script>
$(document).ready(function() {
    $('#container').waterfall({
        itemCls: 'item',
        colWidth: 130,
        gutterWidth: 15,
        gutterHeight: 15,
        checkImagesLoaded: false,
        callbacks: {
            renderData: function(data, dataType) {
                var tpl, template;
                if (data.total < 20) {
                    $('#container').waterfall('pause', function() {
                        $('#waterfall-message').html('<p style="color:#666;">no more data...</p>');
                    });
                }
                if (dataType === 'json' || dataType === 'jsonp') {
                    tpl = $('#waterfall-tpl').html();
                    template = Handlebars.compile(tpl);
                    return template(data);
                } else {
                    return data;
                }
            }
        },
        path: function(page) {
            return 'data/photo-waterfall-page-' + page + '.json';
        }
    });
});
    </script>

  </body>
</html>
